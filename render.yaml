# Blueprint do Render: no painel, New > Blueprint e escolha este repositório.
# Aqui fica só a API. O front é publicado na Vercel.
services:
  # API (FastAPI) com a Gotinha. Roda da raiz para enxergar a pasta agente/.
  - type: web
    name: gota-a-gota-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.principal:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /saude
    buildFilter:
      paths:
        - backend/**
        - agente/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: "FALSE"
      - key: GOOGLE_API_KEY
        sync: false
