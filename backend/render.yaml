services:
  - type: web
    name: gota-a-gota-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.principal:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: "FALSE"
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOTA_API_URL
        sync: false
